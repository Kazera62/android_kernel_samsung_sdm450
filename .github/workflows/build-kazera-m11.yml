name: Build Kazera M11/A11 Kernel

on:
  push:
    branches:
      - lineage-20
  pull_request:
    branches:
      - lineage-20
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Custom kernel name"
        type: string
        required: true
        default: "Kazera M11/A11"
      telegram:
        description: "Send the build ZIP to Telegram"
        type: choice
        required: true
        default: off
        options:
          - off
          - on
      root_impl:
        description: "Root implementation"
        type: choice
        required: true
        default: none
        options:
          - none
          - kernelsu-next
          - sukisu-ultra
          - resukisu
      kpm:
        description: "SukiSU KPM (kernel 4.9 set_memory backport)"
        type: choice
        required: true
        default: off
        options:
          - off
          - on
      susfs:
        description: "ReSukiSU SUSFS for kernel 4.9"
        type: choice
        required: true
        default: off
        options:
          - off
          - on
      susfs_log:
        description: "SUSFS kernel logging"
        type: choice
        required: true
        default: off
        options:
          - off
          - on
      clang:
        description: "Android Clang toolchain"
        type: choice
        required: true
        default: r383902b
        options:
          - r383902b
          - r416183b
          - r370808
          - r365631c
      performance_profile:
        description: "Performance preset (HZ is configured separately)"
        type: choice
        required: true
        default: performance
        options:
          - stock
          - performance
          - balanced
          - latency
      hz:
        description: "Kernel timer frequency"
        type: choice
        required: true
        default: 1000
        options:
          - 100
          - 250
          - 300
          - 1000
      cpu_governor:
        description: "Default CPU frequency governor"
        type: choice
        required: true
        default: performance
        options:
          - performance
          - schedutil
          - interactive
          - ondemand
          - stock
      io_scheduler:
        description: "Default block I/O scheduler"
        type: choice
        required: true
        default: cfq
        options:
          - cfq
          - noop
          - deadline
          - stock
      tcp_congestion:
        description: "Default TCP congestion control"
        type: choice
        required: true
        default: bbr
        options:
          - bbr
          - cubic
          - stock
      zram_writeback:
        description: "zRAM writeback"
        type: choice
        required: true
        default: on
        options:
          - on
          - off
      psi:
        description: "Pressure Stall Information"
        type: choice
        required: true
        default: off
        options:
          - on
          - off
      cortex_a53_tune:
        description: "Tune kernel C code for Cortex-A53"
        type: choice
        required: true
        default: on
        options:
          - on
          - off

permissions:
  contents: read

env:
  KERNEL_NAME_INPUT: ${{ inputs.kernel_name || 'Kazera M11/A11' }}
  TELEGRAM_ENABLE: ${{ inputs.telegram || 'off' }}
  ROOT_IMPL: ${{ inputs.root_impl || 'none' }}
  KPM_ENABLE: ${{ inputs.kpm || 'off' }}
  SUSFS_ENABLE: ${{ inputs.susfs || 'off' }}
  SUSFS_LOG: ${{ inputs.susfs_log || 'off' }}
  CLANG_VERSION: ${{ inputs.clang || 'r383902b' }}
  PERF_PROFILE: ${{ inputs.performance_profile || 'performance' }}
  HZ_CHOICE: ${{ inputs.hz || '1000' }}
  CPU_GOV: ${{ inputs.cpu_governor || 'performance' }}
  IO_SCHED: ${{ inputs.io_scheduler || 'cfq' }}
  TCP_CONG: ${{ inputs.tcp_congestion || 'bbr' }}
  ZRAM_WB: ${{ inputs.zram_writeback || 'on' }}
  PSI_ENABLE: ${{ inputs.psi || 'off' }}
  CORTEX_TUNE: ${{ inputs.cortex_a53_tune || 'on' }}
  ARCH: arm64
  SUBARCH: arm64
  CC: clang
  LD: aarch64-linux-gnu-ld
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v7.0.1
        with:
          ref: lineage-20
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git curl rsync \
            libelf-dev libssl-dev device-tree-compiler cpio gzip \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi zip unzip

      - name: Select and install Clang toolchain
        shell: bash
        run: |
          set -euxo pipefail
          case "$CLANG_VERSION" in
            r383902b|r370808|r365631c)
              CLANG_BRANCH="android11-qpr3-release"
              ;;
            r416183b)
              CLANG_BRANCH="android12-qpr3-s1-release"
              ;;
            *)
              echo "Unsupported Clang: $CLANG_VERSION" >&2
              exit 1
              ;;
          esac
          TOOLCHAIN_ROOT="$HOME/clang-$CLANG_VERSION"
          rm -rf "$TOOLCHAIN_ROOT" clang-toolchain
          if ! git clone --depth=1 --filter=blob:none --sparse --branch "$CLANG_BRANCH" https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-toolchain; then
            rm -rf clang-toolchain
            git clone --depth=1 --sparse --branch "$CLANG_BRANCH" https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-toolchain
          fi
          CLANG_DIR="clang-$CLANG_VERSION"
          git -C clang-toolchain sparse-checkout set "$CLANG_DIR"
          test -x "clang-toolchain/$CLANG_DIR/bin/clang"
          mv "clang-toolchain/$CLANG_DIR" "$TOOLCHAIN_ROOT"
          rm -rf clang-toolchain
          export PATH="$TOOLCHAIN_ROOT/bin:$PATH"
          echo "$TOOLCHAIN_ROOT/bin" >> "$GITHUB_PATH"
          hash -r
          command -v clang
          command -v ld.lld
          clang --version
          aarch64-linux-gnu-ld --version
          aarch64-linux-gnu-gcc --version | head -n 1
          arm-linux-gnueabi-gcc --version | head -n 1
      - name: Validate root feature combinations
        shell: bash
        run: |
          set -euxo pipefail
          if [ "$KPM_ENABLE" = "on" ] && [ "$ROOT_IMPL" != "sukisu-ultra" ]; then
            echo "KPM is wired to SukiSU-Ultra in this 4.9 workflow." >&2
            exit 1
          fi
          if [ "$SUSFS_ENABLE" = "on" ] && [ "$ROOT_IMPL" != "resukisu" ]; then
            echo "SUSFS is wired to ReSukiSU in this 4.9 workflow." >&2
            exit 1
          fi
          if [ "$KPM_ENABLE" = "on" ] && [ "$SUSFS_ENABLE" = "on" ]; then
            echo "Select either SukiSU-Ultra+KPM or ReSukiSU+SUSFS." >&2
            exit 1
          fi

      - name: Integrate selected root implementation
        if: env.ROOT_IMPL != 'none'
        shell: bash
        run: |
          set -euxo pipefail
          case "$ROOT_IMPL" in
            kernelsu-next)
              curl -fLSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
              ;;
            sukisu-ultra)
              curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s builtin
              ;;
            resukisu)
              curl -fLSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
              ;;
            *)
              echo "Unsupported root implementation: $ROOT_IMPL" >&2
              exit 1
              ;;
          esac

      - name: Apply SukiSU compatibility and KPM patches
        if: env.ROOT_IMPL == 'sukisu-ultra' && env.KPM_ENABLE == 'on'
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/fe5053e603e20ce6ba97900da2c3c0229c7505d4/Patches/Patch/set_memory_to_49_and_low.patch" -o /tmp/set_memory_to_49_and_low.patch
          git apply --check /tmp/set_memory_to_49_and_low.patch
          git apply /tmp/set_memory_to_49_and_low.patch
          curl -fL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/fe5053e603e20ce6ba97900da2c3c0229c7505d4/Patches/Patch/sukisu_ultra_fixed.patch" -o /tmp/sukisu_ultra_fixed.patch
          git apply --check /tmp/sukisu_ultra_fixed.patch
          git apply /tmp/sukisu_ultra_fixed.patch

      - name: Apply ReSukiSU SUSFS 4.9 patches
        if: env.ROOT_IMPL == 'resukisu' && env.SUSFS_ENABLE == 'on'
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/fe5053e603e20ce6ba97900da2c3c0229c7505d4/Patches/Patch/susfs_patch_to_4.9.patch" -o /tmp/susfs_patch_to_4.9.patch
          git apply --check /tmp/susfs_patch_to_4.9.patch
          git apply /tmp/susfs_patch_to_4.9.patch
          curl -fL "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/fe5053e603e20ce6ba97900da2c3c0229c7505d4/Patches/susfs_inline_hook_patches.sh" -o /tmp/susfs_inline_hook_patches.sh
          chmod +x /tmp/susfs_inline_hook_patches.sh
          /tmp/susfs_inline_hook_patches.sh
          test -s fs/susfs.c
          test -s include/linux/susfs.h
          test -s include/linux/susfs_def.h
          grep -Rqs "CONFIG_KSU_SUSFS" fs/namespace.c fs/namei.c fs/stat.c fs/exec.c
      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf out

          make O=out ARCH="$ARCH" SUBARCH="$SUBARCH" CC="$CC" LD="$LD" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" a11q_open_defconfig

          KERNEL_NAME_SLUG="$(printf '%s' "$KERNEL_NAME_INPUT" | LC_ALL=C sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          [ -n "$KERNEL_NAME_SLUG" ] || KERNEL_NAME_SLUG="Kazera-M11-A11"
          scripts/config --file out/.config --set-str LOCALVERSION "-$KERNEL_NAME_SLUG"
          scripts/config --file out/.config --disable LOCALVERSION_AUTO
          printf 'KERNEL_NAME_SLUG=%s\n' "$KERNEL_NAME_SLUG" >> "$GITHUB_ENV"

          scripts/config --file out/.config --enable ARCH_ZQL1871
          scripts/config --file out/.config --enable ARCH_SDM450
          scripts/config --file out/.config --enable ARCH_MSM8953

          case "$ROOT_IMPL" in
            none)
              ;;
            kernelsu-next)
              scripts/config --file out/.config --enable KSU
              scripts/config --file out/.config --enable KSU_MANUAL_HOOK
              ;;
            sukisu-ultra)
              scripts/config --file out/.config --enable KPROBES
              scripts/config --file out/.config --enable EXT4_FS
              scripts/config --file out/.config --enable KSU
              if [ "$KPM_ENABLE" = "on" ]; then
                scripts/config --file out/.config --enable KALLSYMS
                scripts/config --file out/.config --enable KALLSYMS_ALL
                scripts/config --file out/.config --enable KPM
              fi
              ;;
            resukisu)
              scripts/config --file out/.config --enable KSU
              if [ "$SUSFS_ENABLE" = "on" ]; then
                scripts/config --file out/.config --enable KSU_SUSFS
                scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH
                scripts/config --file out/.config --enable KSU_SUSFS_SUS_MOUNT
                scripts/config --file out/.config --enable KSU_SUSFS_SUS_KSTAT
                scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_UNAME
                scripts/config --file out/.config --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
                scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
                scripts/config --file out/.config --enable KSU_SUSFS_OPEN_REDIRECT
                scripts/config --file out/.config --enable KSU_SUSFS_SUS_MAP
                if [ "$SUSFS_LOG" = "on" ]; then
                  scripts/config --file out/.config --enable KSU_SUSFS_ENABLE_LOG
                else
                  scripts/config --file out/.config --disable KSU_SUSFS_ENABLE_LOG
                fi
              else
                scripts/config --file out/.config --enable KSU_MANUAL_HOOK
              fi
              ;;
            *)
              echo "Unsupported root implementation: $ROOT_IMPL" >&2
              exit 1
              ;;
          esac

          case "$PERF_PROFILE" in
            stock)
              ;;
            performance)
              scripts/config --file out/.config --enable CC_OPTIMIZE_FOR_PERFORMANCE
              scripts/config --file out/.config --enable PREEMPT_NONE
              scripts/config --file out/.config --enable CPU_BOOST
              scripts/config --file out/.config --enable SCHED_AUTOGROUP
              scripts/config --file out/.config --enable SCHED_TUNE
              ;;
            balanced)
              scripts/config --file out/.config --enable CC_OPTIMIZE_FOR_PERFORMANCE
              scripts/config --file out/.config --enable PREEMPT_VOLUNTARY
              scripts/config --file out/.config --enable CPU_BOOST
              scripts/config --file out/.config --enable SCHED_AUTOGROUP
              scripts/config --file out/.config --enable SCHED_TUNE
              ;;
            latency)
              scripts/config --file out/.config --enable CC_OPTIMIZE_FOR_PERFORMANCE
              scripts/config --file out/.config --enable PREEMPT
              scripts/config --file out/.config --enable CPU_BOOST
              scripts/config --file out/.config --enable SCHED_AUTOGROUP
              scripts/config --file out/.config --enable SCHED_TUNE
              ;;
            *)
              echo "Unsupported performance profile: $PERF_PROFILE" >&2
              exit 1
              ;;
          esac

          case "$HZ_CHOICE" in
            100)
              scripts/config --file out/.config --disable HZ_250 --disable HZ_300 --disable HZ_1000 --enable HZ_100
              ;;
            250)
              scripts/config --file out/.config --disable HZ_100 --disable HZ_300 --disable HZ_1000 --enable HZ_250
              ;;
            300)
              scripts/config --file out/.config --disable HZ_100 --disable HZ_250 --disable HZ_1000 --enable HZ_300
              ;;
            1000)
              scripts/config --file out/.config --disable HZ_100 --disable HZ_250 --disable HZ_300 --enable HZ_1000
              ;;
            *)
              echo "Unsupported HZ: $HZ_CHOICE" >&2
              exit 1
              ;;
          esac

          if [ "$CPU_GOV" != "stock" ]; then
            for gov in PERFORMANCE POWERSAVE USERSPACE ONDEMAND CONSERVATIVE SCHEDUTIL INTERACTIVE; do
              scripts/config --file out/.config --disable "CPU_FREQ_GOV_$gov" || true
              scripts/config --file out/.config --disable "CPU_FREQ_DEFAULT_GOV_$gov" || true
            done
          fi

          case "$CPU_GOV" in
            performance)
              scripts/config --file out/.config --enable CPU_FREQ_GOV_PERFORMANCE
              scripts/config --file out/.config --enable CPU_FREQ_DEFAULT_GOV_PERFORMANCE
              ;;
            schedutil)
              scripts/config --file out/.config --enable CPU_FREQ_GOV_SCHEDUTIL
              scripts/config --file out/.config --enable CPU_FREQ_DEFAULT_GOV_SCHEDUTIL
              ;;
            interactive)
              scripts/config --file out/.config --enable CPU_FREQ_GOV_INTERACTIVE
              scripts/config --file out/.config --enable CPU_FREQ_DEFAULT_GOV_INTERACTIVE
              ;;
            ondemand)
              scripts/config --file out/.config --enable CPU_FREQ_GOV_ONDEMAND
              scripts/config --file out/.config --enable CPU_FREQ_DEFAULT_GOV_ONDEMAND
              ;;
            stock)
              ;;
            *)
              echo "Unsupported CPU governor: $CPU_GOV" >&2
              exit 1
              ;;
          esac

          case "$IO_SCHED" in
            cfq)
              scripts/config --file out/.config --enable IOSCHED_CFQ --disable IOSCHED_NOOP --disable IOSCHED_DEADLINE
              scripts/config --file out/.config --enable DEFAULT_CFQ --disable DEFAULT_NOOP --disable DEFAULT_DEADLINE
              scripts/config --file out/.config --set-str DEFAULT_IOSCHED cfq
              ;;
            noop)
              scripts/config --file out/.config --enable IOSCHED_NOOP --disable IOSCHED_CFQ --disable IOSCHED_DEADLINE
              scripts/config --file out/.config --disable DEFAULT_CFQ --enable DEFAULT_NOOP --disable DEFAULT_DEADLINE
              scripts/config --file out/.config --set-str DEFAULT_IOSCHED noop
              ;;
            deadline)
              scripts/config --file out/.config --enable IOSCHED_DEADLINE --disable IOSCHED_CFQ --disable IOSCHED_NOOP
              scripts/config --file out/.config --disable DEFAULT_CFQ --disable DEFAULT_NOOP --enable DEFAULT_DEADLINE
              scripts/config --file out/.config --set-str DEFAULT_IOSCHED deadline
              ;;
            stock)
              ;;
            *)
              echo "Unsupported I/O scheduler: $IO_SCHED" >&2
              exit 1
              ;;
          esac

          case "$TCP_CONG" in
            bbr)
              scripts/config --file out/.config --enable TCP_CONG_ADVANCED --enable TCP_CONG_BBR --enable NET_SCH_FQ --enable DEFAULT_BBR --disable DEFAULT_CUBIC --set-str DEFAULT_TCP_CONG bbr
              ;;
            cubic)
              scripts/config --file out/.config --enable TCP_CONG_ADVANCED --enable TCP_CONG_CUBIC --disable TCP_CONG_BBR --disable DEFAULT_BBR --enable DEFAULT_CUBIC --set-str DEFAULT_TCP_CONG cubic
              ;;
            stock)
              ;;
            *)
              echo "Unsupported TCP congestion: $TCP_CONG" >&2
              exit 1
              ;;
          esac

          scripts/config --file out/.config --enable ZRAM
          if [ "$ZRAM_WB" = "on" ]; then
            scripts/config --file out/.config --enable ZRAM_WRITEBACK --enable ZRAM_LRU_WRITEBACK
          else
            scripts/config --file out/.config --disable ZRAM_WRITEBACK --disable ZRAM_LRU_WRITEBACK
          fi

          if [ "$PSI_ENABLE" = "on" ]; then
            scripts/config --file out/.config --enable PSI
          else
            scripts/config --file out/.config --disable PSI
          fi

          if [ "$CORTEX_TUNE" = "on" ]; then
            KCFLAGS="-mcpu=cortex-a53+crypto"
          else
            KCFLAGS=""
          fi
          printf "%s\n" "KCFLAGS=$KCFLAGS" > out/kazera-build-env.txt

          make O=out ARCH="$ARCH" SUBARCH="$SUBARCH" CC="$CC" LD="$LD" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" olddefconfig

          grep -E "^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_SUSFS=|CONFIG_KPM=|CONFIG_KPROBES=|CONFIG_KALLSYMS_ALL=|CONFIG_HZ=|CONFIG_HZ_|CONFIG_CPU_FREQ_DEFAULT_GOV=|CONFIG_DEFAULT_TCP_CONG=|CONFIG_DEFAULT_IOSCHED=|CONFIG_ZRAM_WRITEBACK=|CONFIG_PREEMPT|CONFIG_PSI=|CONFIG_LOCALVERSION=)" out/.config || true
          test "$(grep -c "^CONFIG_ARCH_ZQL1871=y$" out/.config)" -eq 1
          test "$(grep -c "^CONFIG_ARCH_SDM450=y$" out/.config)" -eq 1
          test "$(grep -c "^CONFIG_ARCH_MSM8953=y$" out/.config)" -eq 1

          case "$ROOT_IMPL:$KPM_ENABLE:$SUSFS_ENABLE" in
            sukisu-ultra:on:off)
              test "$(grep -c "^CONFIG_KSU=y$" out/.config)" -eq 1
              test "$(grep -c "^CONFIG_KPM=y$" out/.config)" -eq 1
              test "$(grep -c "^CONFIG_KALLSYMS_ALL=y$" out/.config)" -eq 1
              ;;
            resukisu:off:on)
              test "$(grep -c "^CONFIG_KSU=y$" out/.config)" -eq 1
              test "$(grep -c "^CONFIG_KSU_SUSFS=y$" out/.config)" -eq 1
              test -s fs/susfs.c
              test -s include/linux/susfs.h
              test -s include/linux/susfs_def.h
              ;;
            kernelsu-next:off:off)
              test "$(grep -c "^CONFIG_KSU=y$" out/.config)" -eq 1
              test "$(grep -c "^CONFIG_KSU_MANUAL_HOOK=y$" out/.config)" -eq 1
              ;;
            none:off:off)
              ;;
            *)
              echo "Unexpected feature combination after configuration." >&2
              exit 1
              ;;
          esac
      - name: Build kernel and DTBs
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$CORTEX_TUNE" = "on" ]; then KCFLAGS="-mcpu=cortex-a53+crypto"; else KCFLAGS=""; fi

          make O=out ARCH="$ARCH" SUBARCH="$SUBARCH" CC="$CC" LD="$LD" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" KCFLAGS="$KCFLAGS" dtbs -j"$(nproc)"
          make O=out ARCH="$ARCH" SUBARCH="$SUBARCH" CC="$CC" LD="$LD" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" KCFLAGS="$KCFLAGS" Image.gz-dtb vmlinux -j"$(nproc)"
          NM=llvm-nm scripts/mksysmap out/vmlinux out/System.map

          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/Image.gz-dtb
          test -s out/vmlinux
          test -s out/System.map
          test -d out/arch/arm64/boot/dts/samsung
          test -n "$(find out/arch/arm64/boot/dts/samsung -maxdepth 1 \( -name "*.dtb" -o -name "*.dtbo" \) -type f -print -quit)"
          find out/arch/arm64/boot/dts/samsung -maxdepth 1 \( -name "*.dtb" -o -name "*.dtbo" \) -type f -print | sort
      - name: Package artifacts
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist/dtb/samsung

          cp out/arch/arm64/boot/Image.gz dist/Image.gz
          cp out/vmlinux dist/vmlinux
          cp out/System.map dist/System.map
          cp out/.config dist/.config
          cp out/kazera-build-env.txt dist/kazera-build-env.txt

          find out/arch/arm64/boot/dts/samsung -maxdepth 1 \( -name "*.dtb" -o -name "*.dtbo" \) -type f -exec cp {} dist/dtb/samsung/ \;

          {
            echo "kernel_repo=https://github.com/Kazera62/android_kernel_samsung_sdm450"
            echo "kernel_branch=$GITHUB_REF_NAME"
            echo "kernel_commit=$GITHUB_SHA"
            echo "kernel_name=$KERNEL_NAME_INPUT"
            echo "kernel_name_slug=$KERNEL_NAME_SLUG"
            echo "root_impl=$ROOT_IMPL"
            echo "kpm=$KPM_ENABLE"
            echo "susfs=$SUSFS_ENABLE"
            echo "susfs_log=$SUSFS_LOG"
            echo "clang=$CLANG_VERSION"
            echo "performance_profile=$PERF_PROFILE"
            echo "hz=$HZ_CHOICE"
            echo "cpu_governor=$CPU_GOV"
            echo "io_scheduler=$IO_SCHED"
            echo "tcp_congestion=$TCP_CONG"
            echo "zram_writeback=$ZRAM_WB"
            echo "psi=$PSI_ENABLE"
            echo "cortex_a53_tune=$CORTEX_TUNE"
            echo "base_config=a11q_open_defconfig"
            echo "target=Samsung SM-M11 / SM-A11 (SDM450)"
            echo "kernel_release=$(make -s O=out kernelrelease)"
          } > dist/BUILD_INFO.txt

          (cd dist && sha256sum Image.gz vmlinux System.map .config BUILD_INFO.txt kazera-build-env.txt dtb/samsung/* 2>/dev/null || true) > dist/SHA256SUMS

          tar -C dist -czf "kazera-m11-kernel-$(git rev-parse --short=7 HEAD)-$ROOT_IMPL-$CLANG_VERSION.tar.gz" .

          AK3_COMMIT="6f88dff82b786e879b255a8e1523547c4f62d031"
          rm -rf .anykernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git .anykernel3
          git -C .anykernel3 fetch --depth=1 origin "$AK3_COMMIT"
          git -C .anykernel3 checkout --detach "$AK3_COMMIT"
          test "$(git -C .anykernel3 rev-parse HEAD)" = "$AK3_COMMIT"

          cp out/arch/arm64/boot/Image.gz-dtb .anykernel3/Image.gz-dtb
          cp anykernel3/anykernel.sh .anykernel3/anykernel.sh

          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path(".anykernel3/anykernel.sh")
          text = path.read_text(encoding="utf-8")
          name = os.environ.get("KERNEL_NAME_INPUT", "KernelSU Next for Galaxy A11/M11 ARM64-Only")
          name = name.replace(chr(13), " ").replace(chr(10), " ").replace(chr(39), "")
          name = re.sub(r"\s+", " ", name).strip()
          if not name:
              name = "KernelSU Next for Galaxy A11/M11 ARM64-Only"

          text, count = re.subn(
              r"^kernel\.string=.*$"
              lambda _: "kernel.string=" + name,
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit("kernel.string line not found exactly once")
          path.write_text(text, encoding="utf-8")
          PY

          test -s .anykernel3/Image.gz-dtb
          test -s .anykernel3/anykernel.sh
          test -s .anykernel3/tools/ak3-core.sh
          test -x .anykernel3/tools/magiskboot
          test -f .anykernel3/META-INF/com/google/android/update-binary
          test -f .anykernel3/META-INF/com/google/android/updater-script

          bash -n .anykernel3/anykernel.sh
          grep -Fq "device.name1=sdm450" .anykernel3/anykernel.sh
          grep -Fq "device.name2=m11q" .anykernel3/anykernel.sh
          grep -Fq "device.name3=a11q" .anykernel3/anykernel.sh
          grep -Fq "BLOCK=/dev/block/by-name/boot" .anykernel3/anykernel.sh
          grep -Fq "IS_SLOT_DEVICE=0" .anykernel3/anykernel.sh
          grep -Fq "do.modules=0" .anykernel3/anykernel.sh
          grep -Fq "do.systemless=0" .anykernel3/anykernel.sh

          {
            echo "kernel_name=$KERNEL_NAME_INPUT"
            echo "kernel_name_slug=$KERNEL_NAME_SLUG"
            echo "root_impl=$ROOT_IMPL"
            echo "kpm=$KPM_ENABLE"
            echo "susfs=$SUSFS_ENABLE"
            echo "susfs_log=$SUSFS_LOG"
            echo "clang=$CLANG_VERSION"
            echo "performance_profile=$PERF_PROFILE"
            echo "hz=$HZ_CHOICE"
            echo "cpu_governor=$CPU_GOV"
            echo "io_scheduler=$IO_SCHED"
            echo "tcp_congestion=$TCP_CONG"
            echo "zram_writeback=$ZRAM_WB"
            echo "psi=$PSI_ENABLE"
            echo "cortex_a53_tune=$CORTEX_TUNE"
            echo "base_config=a11q_open_defconfig"
            echo "target=Samsung SM-M11 / SM-A11 (SDM450)"
            echo "anykernel3_commit=$AK3_COMMIT"
            echo "kernel_release=$(make -s O=out kernelrelease)"
          } > .anykernel3/KAZERA_BUILD_INFO.txt

          (
            cd .anykernel3
            sha256sum Image.gz-dtb anykernel.sh KAZERA_BUILD_INFO.txt > KAZERA_SHA256SUMS
            zip -r9 "$GITHUB_WORKSPACE/dist/${KERNEL_NAME_SLUG}-AnyKernel3-${GITHUB_RUN_NUMBER}.zip" . -x ".git/*"
          )

          TELEGRAM_ZIP="$GITHUB_WORKSPACE/dist/${KERNEL_NAME_SLUG}-AnyKernel3-${GITHUB_RUN_NUMBER}.zip"
          test -s "$TELEGRAM_ZIP"
          unzip -tq "$TELEGRAM_ZIP"
          unzip -l "$TELEGRAM_ZIP" | grep -q "Image.gz-dtb"
          unzip -l "$TELEGRAM_ZIP" | grep -q "anykernel.sh"
          unzip -l "$TELEGRAM_ZIP" | grep -q "META-INF/com/google/android/update-binary"
          unzip -l "$TELEGRAM_ZIP" | grep -q "tools/ak3-core.sh"
          printf 'TELEGRAM_ZIP=%s\n' "$TELEGRAM_ZIP" >> "$GITHUB_ENV"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kazera-m11-kernel-${{ github.run_number }}
          path: |
            dist/Image.gz
            dist/vmlinux
            dist/System.map
            dist/.config
            dist/kazera-build-env.txt
            dist/BUILD_INFO.txt
            dist/SHA256SUMS
            dist/kazera-m11-kernel-*.tar.gz
            dist/*-AnyKernel3-*.zip
            dist/dtb/samsung/*.dtb
            dist/dtb/samsung/*.dtbo
          if-no-files-found: error
          retention-days: 30
      - name: Send build ZIP to Telegram
        if: env.TELEGRAM_ENABLE == 'on'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          test -n "$TELEGRAM_BOT_TOKEN" || {
            echo "TELEGRAM_BOT_TOKEN secret is missing." >&2
            exit 1
          }
          test -n "$TELEGRAM_CHAT_ID" || {
            echo "TELEGRAM_CHAT_ID secret is missing." >&2
            exit 1
          }
          test -s "$TELEGRAM_ZIP"

          FILE_SIZE="$(stat -c '%s' "$TELEGRAM_ZIP")"
          MAX_TELEGRAM_BYTES=50000000
          if [ "$FILE_SIZE" -gt "$MAX_TELEGRAM_BYTES" ]; then
            echo "Telegram ZIP is $FILE_SIZE bytes, exceeding Telegram's 50 MB bot upload limit." >&2
            exit 1
          fi

          CAPTION="${KERNEL_NAME_INPUT} | run #${GITHUB_RUN_NUMBER} | root=${ROOT_IMPL} | HZ=${HZ_CHOICE} | CPU=${CPU_GOV} | IO=${IO_SCHED} | TCP=${TCP_CONG}"

          RESPONSE="$(
            curl -fsS --retry 3 --retry-all-errors \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${TELEGRAM_ZIP};type=application/zip" \
              -F "caption=${CAPTION}"
          )"

          printf '%s\n' "$RESPONSE" |
            grep -q '"ok"[[:space:]]*:[[:space:]]*true' || {
              echo "Telegram API did not report success." >&2
              printf '%s\n' "$RESPONSE" >&2
              exit 1
            }
