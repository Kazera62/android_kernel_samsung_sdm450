name: Build Kazera M11/A11 Kernel

on:
  push:
    branches:
      - lineage-20
  pull_request:
    branches:
      - lineage-20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: lineage-20
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libssl-dev device-tree-compiler cpio gzip binutils-aarch64-linux-gnu python3 rsync

      - name: Install Android Clang r365631c
        shell: bash
        run: |
          set -euxo pipefail
          TOOLCHAIN="$HOME/clang-r365631c"
          mkdir -p "$TOOLCHAIN"
          curl -L --retry 5 --retry-delay 2 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r365631c.tar.gz" -o /tmp/clang-r365631c.tar.gz
          tar -xzf /tmp/clang-r365631c.tar.gz -C "$TOOLCHAIN"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"
          clang --version
          ld.lld --version

      - name: Configure
        env:
          ARCH: arm64
          SUBARCH: arm64
          CC: clang
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -euxo pipefail
          rm -rf out
          make O=out ARCH="$ARCH" CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" a11q_open_defconfig
          make O=out ARCH="$ARCH" CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          grep -E "^(CONFIG_ARCH_ZQL1871=y|CONFIG_ARCH_SDM450=y|CONFIG_ARCH_MSM8953=y|CONFIG_LOCALVERSION=)" out/.config
          test "$(grep -c "^CONFIG_ARCH_ZQL1871=y$" out/.config)" -eq 1
          test "$(grep -c "^CONFIG_ARCH_SDM450=y$" out/.config)" -eq 1
          test "$(grep -c "^CONFIG_ARCH_MSM8953=y$" out/.config)" -eq 1

      - name: Build kernel and DTBs
        env:
          ARCH: arm64
          SUBARCH: arm64
          CC: clang
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -euxo pipefail
          make O=out ARCH="$ARCH" CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" dtbs -j"$(nproc)"
          make O=out ARCH="$ARCH" CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" Image.gz vmlinux System.map -j"$(nproc)"
          test -s out/arch/arm64/boot/Image.gz
          test -s out/vmlinux
          test -s out/System.map
          test -d out/arch/arm64/boot/dts/samsung
          find out/arch/arm64/boot/dts/samsung -maxdepth 1 \( -name "*.dtb" -o -name "*.dtbo" \) -type f -print | sort

      - name: Package artifacts
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist/dtb/samsung
          cp out/arch/arm64/boot/Image.gz dist/Image.gz
          cp out/vmlinux dist/vmlinux
          cp out/System.map dist/System.map
          cp out/.config dist/.config
          find out/arch/arm64/boot/dts/samsung -maxdepth 1 \( -name "*.dtb" -o -name "*.dtbo" \) -type f -exec cp {} dist/dtb/samsung/ \;
          {
            echo "kernel_repo=https://github.com/Kazera62/android_kernel_samsung_sdm450"
            echo "kernel_branch=$GITHUB_REF_NAME"
            echo "kernel_commit=$GITHUB_SHA"
            echo "base_config=a11q_open_defconfig"
            echo "target=Samsung SM-M11 / SM-A11 (SDM450)"
            echo "kernel_release=$(make -s O=out kernelrelease)"
          } > dist/BUILD_INFO.txt
          (cd dist && sha256sum Image.gz vmlinux System.map .config BUILD_INFO.txt dtb/samsung/* 2>/dev/null || true) > dist/SHA256SUMS
          tar -C dist -czf "kazera-m11-kernel-${GITHUB_SHA::7}.tar.gz" .

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kazera-m11-kernel
          path: |
            dist/Image.gz
            dist/vmlinux
            dist/System.map
            dist/.config
            dist/BUILD_INFO.txt
            dist/SHA256SUMS
            dist/kazera-m11-kernel-*.tar.gz
            dist/dtb/samsung/*.dtb
            dist/dtb/samsung/*.dtbo
          if-no-files-found: error
          retention-days: 30
